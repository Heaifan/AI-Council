<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 顾问委员会 · 开发验证台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <h1>AI 顾问委员会 · 开发验证台</h1>
  <span class="badge">人工网页中继</span>
  <div id="project-bar" class="project-bar"></div>
</header>

<div id="capabilities" class="capability-row"></div>
<div id="runtime-status" class="runtime-status">当前状态：等待选择项目目录</div>

<section class="controls project-controls">
  <input type="file" id="dir-input" webkitdirectory directory multiple hidden>
  <input type="file" id="schema-input" accept="application/json,.json" hidden>
</section>

<div id="status" class="status info">正在加载…</div>

<nav class="tabs" role="tablist">
  <button type="button" class="tab" id="tab-btn-protocols" role="tab">议事规则</button>
  <button type="button" class="tab active" id="tab-btn-meeting" role="tab">会议</button>
  <button type="button" class="tab" id="tab-btn-compiler" role="tab">指令编译</button>
</nav>

<main>
  <section class="tab-panel" id="tab-protocols">
    <div id="output"></div>
  </section>
  <section class="tab-panel active" id="tab-meeting">
    <div class="console" id="console">
      <aside class="console-left" id="console-left"></aside>
      <section class="console-center" id="console-center"></section>
      <aside class="console-right" id="console-right"></aside>
    </div>
    <div class="console-drawer" id="console-drawer">
      <div id="console-devtools" class="drawer-item"></div>
      <div id="console-timeline" class="drawer-item"></div>
    </div>
  </section>
  <section class="tab-panel" id="tab-compiler">
    <div id="view-compiler"></div>
  </section>
</main>

<footer class="foot">
  <p><strong>运行规则</strong>：目录选择后建立只读快照。磁盘文件变化不会影响当前 Session；
     重新选择项目目录后才重新加载。本应用不提供热刷新，也不发起任何网络请求。</p>
  <p><strong>当前能力</strong>：议事规则 / 会议运行时 / 会议存档 / 指令编译器 / 提示词渲染器 / 网页中继。
     网页中继由人工搬运提示词与回答，系统不会自动相信外部 AI 的输出。</p>
</footer>
